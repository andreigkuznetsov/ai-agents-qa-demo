name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Lint, format, type check and unit tests
        run: docker build --progress=plain --target checks ./backend
      - name: Build runtime image
        run: docker build --progress=plain --tag ai-agents-qa-demo:ci ./backend
      - name: Smoke test the liveness endpoint
        run: |
          container=$(docker run --detach --publish 127.0.0.1:18080:8080 \
            --env UVICORN_PORT=8080 ai-agents-qa-demo:ci)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker inspect --format '{{json .State}}' "$container" || true
              docker logs "$container" || true
            fi
            docker rm --force "$container" >/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          # Uvicorn binds its listener after ASGI startup.
          docker exec --interactive "$container" /app/.venv/bin/python - <<'PY'
          import os
          import socket
          import time

          address = ("127.0.0.1", int(os.environ["UVICORN_PORT"]))
          deadline = time.monotonic() + 20
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit("Uvicorn did not start listening within 20 seconds")
              try:
                  with socket.create_connection(address, timeout=min(remaining, 0.5)):
                      break
              except OSError:
                  time.sleep(min(0.2, max(0, deadline - time.monotonic())))
          PY

          response=$(curl --fail --silent --show-error --max-time 5 \
            --write-out '\n%{http_code}' http://127.0.0.1:18080/health/live)
          if [ "$response" != $'{"status":"ok"}\n200' ]; then
            printf 'Unexpected liveness response (body and status): %q\n' "$response" >&2
            exit 1
          fi

      - name: Prepare the isolated PostgreSQL test environment
        run: |
          tool=$(docker create ghcr.io/astral-sh/uv:0.13.9@sha256:d3b601f0c7b118bc1753febf7c41cc80981df678445e0254284eecf84db79a7d)
          docker cp "$tool:/uv" "$RUNNER_TEMP/uv"
          docker rm "$tool"
          docker compose version
          timeout 90s docker pull postgres:18.7-bookworm@sha256:194e55feb2597b1465dbee81cc9fd8d204566cd2eb42c8d22fd6c931a38781b1
          cd backend
          timeout 90s "$RUNNER_TEMP/uv" sync --locked --python 3.13.18

      - name: Test migration, permissions and failure handling on isolated PostgreSQL
        env:
          QA_RUN_POSTGRES_TESTS: '1'
          QA_IT_IMAGE: ai-agents-qa-demo:ci
        working-directory: backend
        run: |
          timeout 60s .venv/bin/python -m pytest -v -p no:cacheprovider -o faulthandler_timeout=25 tests/test_run_store.py::test_cancelled_write_recovery
          .venv/bin/python -m pytest -vx -p no:cacheprovider -o faulthandler_timeout=45 --durations=12 --junitxml "$RUNNER_TEMP/postgres-tests.xml"
